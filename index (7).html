  if (!target && !document.querySelector('details.vq-set[open]')) target = document.querySelector('details.vq-set[data-sec="profile"]');
  if (target) { target.open = true; if (want) setTimeout(function () { try { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }, 60); }
  loadProfileExtras(); loadMfa();

/* ---------- idle sign-out ---------- */
var IDLE_KEY = 'voiceiq_last_active';
function touch() { try { sessionStorage.setItem(IDLE_KEY, String(Date.now())); } catch (e) {} }
var lastTouch = 0;
function onActivity() { var n = Date.now(); if (n - lastTouch > 15000) { lastTouch = n; touch(); } }
function idleCheck() {
  var s = sess(); if (!s) return;
  var last = 0; try { last = Number(sessionStorage.getItem(IDLE_KEY)) || 0; } catch (e) {}
  if (!last) { touch(); return; }
  if (Date.now() - last > IDLE_MIN * 60 * 1000) {
    try { sessionStorage.removeItem(IDLE_KEY); } catch (e) {}
    try { VQAuth.endSession('You were signed out after ' + IDLE_MIN + ' minutes of inactivity.'); } catch (e) {}
  }
}
['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, onActivity, { passive: true }); });
setInterval(idleCheck, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) idleCheck(); });
idleCheck();

/* ---------- wiring ---------- */
var CSS = '.vq-set{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:0 0 14px;max-width:760px;overflow:hidden}' +
  '.vq-set>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:12px;padding:16px 18px}' +
  '.vq-set>summary::-webkit-details-marker{display:none}.vq-set>summary:hover{background:rgba(255,255,255,.03)}.vq-set>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}' +
  '.vq-set-t{font-weight:800;font-size:16.5px}.vq-set-s{grid-column:1;color:var(--text-dim);font-size:13.5px;margin-top:2px}.vq-set-chev{grid-row:1/3;grid-column:2;align-self:center;transition:transform .15s;color:var(--text-dim)}' +
  '.vq-set[open]>summary .vq-set-chev{transform:rotate(180deg)}.vq-set[open]>summary{border-bottom:1px solid var(--border-soft)}' +
  '.vq-set-body{padding:14px 18px 18px}.vq-set-body>.card{max-width:none!important;margin-top:0!important;margin-bottom:14px;background:var(--bg-elevated,transparent)}.vq-set-body>.card:last-child{margin-bottom:0}' +
  '.vq-acct-pop .vq-acct-link{text-align:left}';

function wire() {
  if (typeof VIEWS === 'undefined' || !VIEWS.account || typeof NAV === 'undefined' || window.__vqSettingsWired) return;
  window.__vqSettingsWired = true;
  injectCss();
  // one sidebar entry, "Settings", for everyone -- it opens the unified page
  NAV.forEach(function (g) { g.items.forEach(function (it) { if (it.id === 'settings') { it.id = 'account'; it.label = 'Settings'; delete it.showIf; } }); });
  var orig = VIEWS.account;
  VIEWS.account = function () { var html = orig.apply(this, arguments); try { return restructure(html); } catch (e) { return html; } };
  var origNavigate = window.navigate;
  window.navigate = function (view) { var r = origNavigate.apply(this, arguments); if (view === 'account') setTimeout(openRequested, 40); return r; };
  try { if (typeof renderNav === 'function') renderNav(); } catch (e) {}
  try { if (typeof state !== 'undefined' && state.view === 'account') { render(); setTimeout(openRequested, 40); } } catch (e) {}
}
window.VQSettings = { saveProfile: saveProfile, removePhoto: removePhoto, loadMfa: loadMfa, mfaStart: mfaStart, mfaConfirm: mfaConfirm, mfaDisable: mfaDisable };
// run after every other module has wrapped VIEWS.account (billing, support)

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', later); else later();
})();
</script>

    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return iso; }
}
function full(iso) { if (!iso) return ''; try { return new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return iso || ''; } }
function kes(n) { n = Number(n) || 0; return 'KES ' + n.toLocaleString(); }
var ICON = { account: '\uD83D\uDC64', security: '\uD83D\uDD10', analysis: '\uD83D\uDCCA', payment: '\uD83D\uDCB3', support: '\uD83D\uDCAC' };
function planBadge(c) {
  var active = c.plan === 'paid' && (!c.subscription_expires_at || new Date(c.subscription_expires_at) > new Date());
  if (active) return '<span class="badge" style="background:var(--success);color:#04202b;">Monthly</span>';
  if (Number(c.purchased_credits) > 0) return '<span class="badge" style="background:var(--accent);color:#04202b;">' + c.purchased_credits + ' credit' + (c.purchased_credits == 1 ? '' : 's') + '</span>';
  if (c.plan === 'paid') return '<span class="badge" style="background:var(--warn,#f5a524);color:#04202b;">Expired</span>';
  return '<span class="badge" style="background:var(--surface-2);">' + (Number(c.trial_comments_used) > 0 ? 'Trial used' : 'Trial') + '</span>';
}

var CL = { rows: null, feed: null, error: null, q: '', selected: null, timeline: null, tlError: null };

function load(force) {
  if (CL.rows && !force) return;
  CL.error = null; if (force) { CL.rows = null; CL.feed = null; }
  Promise.all([rpc('admin_clients'), rpc('admin_recent_activity', { p_limit: 60 })])
    .then(function (r) { CL.rows = r[0] || []; CL.feed = r[1] || []; rerender(); })
    .catch(function (e) { CL.error = e.status === 404 ? 'Run migration 27_admin_client_activity.sql in Supabase to turn this page on.' : /admin_only/.test(e.message) ? 'Only the platform admin can see this page.' : 'Couldn\u2019t load clients: ' + e.message; CL.rows = []; CL.feed = []; rerender(); });
}
function openClient(id) {
  CL.selected = id; CL.timeline = null; CL.tlError = null; rerender();
  rpc('admin_client_timeline', { p_user: id, p_limit: 300 }).then(function (t) { CL.timeline = t || []; rerender(); })
    .catch(function (e) { CL.tlError = 'Couldn\u2019t load activity: ' + e.message; CL.timeline = []; rerender(); });
  try { window.scrollTo(0, 0); } catch (e) {}
}
function rerender() { try { if (typeof state !== 'undefined' && state.view === 'clients') render(); } catch (e) {} }

function listHtml() {
  var rows = CL.rows || [], q = CL.q.trim().toLowerCase();
  var shown = rows.filter(function (c) { return !q || [c.email, c.name, c.business_name, c.phone].join(' ').toLowerCase().indexOf(q) !== -1; });
  var paying = rows.filter(function (c) { return Number(c.payments) > 0; }).length;
  var revenue = rows.reduce(function (a, c) { return a + (Number(c.paid_total) || 0); }, 0);
  var analyses = rows.reduce(function (a, c) { return a + (Number(c.analyses) || 0); }, 0);
  var open = rows.reduce(function (a, c) { return a + (Number(c.open_tickets) || 0); }, 0);
  var stat = function (label, val) { return '<div class="card vq-cl-stat"><div class="m-label">' + label + '</div><div class="vq-cl-num">' + val + '</div></div>'; };
  var table = shown.length ? '<div class="table-card table-wrap"><table><thead><tr><th>Client</th><th>Plan</th><th>Analyses</th><th>Paid</th><th>Last active</th><th>Tickets</th></tr></thead><tbody>' +
    shown.map(function (c) {
      return '<tr class="vq-cl-row" onclick="VQClients.open(\'' + esc(c.id) + '\')" tabindex="0" onkeydown="if(event.key===\'Enter\')VQClients.open(\'' + esc(c.id) + '\')">' +
        '<td><div style="font-weight:700;">' + esc(c.business_name || c.name || '(no name)') + (c.is_admin ? ' <span class="badge">admin</span>' : '') + '</div><div class="field-hint">' + esc(c.email || '') + '</div></td>' +
        '<td>' + planBadge(c) + '</td><td class="mono">' + (Number(c.analyses) || 0) + '</td><td class="mono">' + (Number(c.paid_total) ? kes(c.paid_total) : '\u2014') + '</td>' +
        '<td title="' + esc(full(c.last_active)) + '">' + esc(when(c.last_active)) + '</td>' +
        '<td>' + (Number(c.open_tickets) ? '<span class="badge" style="background:var(--danger-dim);color:var(--danger);">' + c.open_tickets + ' open</span>' : '\u2014') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="card empty-state"><p>' + (q ? 'No client matches that search.' : 'No clients yet.') + '</p></div>';
  var feed = (CL.feed || []).slice(0, 40).map(function (e) {
    return '<div class="vq-cl-ev" onclick="VQClients.open(\'' + esc(e.user_id) + '\')"><span class="vq-cl-ic">' + (ICON[e.kind] || '\u2022') + '</span><div style="min-width:0;"><div><strong>' + esc(e.who || e.email || 'Client') + '</strong> \u2014 ' + esc(e.title) + '</div>' +
      (e.detail ? '<div class="field-hint vq-cl-ellip">' + esc(e.detail) + '</div>' : '') + '</div><span class="vq-cl-when" title="' + esc(full(e.at)) + '">' + esc(when(e.at)) + '</span></div>';
  }).join('') || '<div class="vq-acct-dim">Nothing yet.</div>';
  return '<div class="grid vq-cl-stats">' + stat('Clients', rows.length) + stat('Paying clients', paying) + stat('Analyses run', analyses) + stat('Revenue (confirmed)', kes(revenue)) + stat('Open tickets', open) + '</div>' +
    '<div class="vq-cl-cols"><div style="min-width:0;">' +
      '<div style="display:flex;gap:8px;margin-bottom:12px;"><input type="text" id="vqClSearch" placeholder="Search name, business, email or phone\u2026" value="' + esc(CL.q) + '" oninput="VQClients.search(this.value)" style="flex:1;"><button class="btn btn-sm btn-secondary" onclick="VQClients.refresh()">Refresh</button></div>' +
      table + '</div>' +
      '<div class="card vq-cl-feed"><div class="section-label" style="margin-bottom:8px;">Live activity</div>' + feed + '</div></div>';
}
function detailHtml() {
  var c = (CL.rows || []).filter(function (x) { return x.id === CL.selected; })[0] || {};
  var kv = function (k, v) { return '<div class="vq-cl-kv"><span>' + k + '</span><strong>' + (v || '\u2014') + '</strong></div>'; };
  var tl = CL.timeline === null ? '<div style="display:flex;gap:10px;align-items:center;color:var(--text-dim);"><div class="spinner" style="width:18px;height:18px;margin:0;"></div>Loading activity\u2026</div>'
    : CL.tlError ? '<div class="banner error" style="margin:0;">' + esc(CL.tlError) + '</div>'
    : CL.timeline.length ? CL.timeline.map(function (e) {
        return '<div class="vq-cl-tl vq-cl-' + esc(e.kind) + '"><span class="vq-cl-ic">' + (ICON[e.kind] || '\u2022') + '</span><div style="min-width:0;flex:1;"><div style="font-weight:700;">' + esc(e.title) + '</div>' + (e.detail ? '<div class="field-hint" style="overflow-wrap:anywhere;">' + esc(e.detail) + '</div>' : '') + '</div><span class="vq-cl-when" title="' + esc(full(e.at)) + '">' + esc(full(e.at)) + '</span></div>';
      }).join('') : '<div class="vq-acct-dim">No activity recorded.</div>';
  return '<button class="btn btn-sm btn-secondary" onclick="VQClients.back()" style="margin-bottom:14px;">\u2190 All clients</button>' +
    '<div class="vq-cl-cols"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;"><div><div style="font-size:19px;font-weight:800;">' + esc(c.business_name || c.name || c.email || 'Client') + '</div><div class="field-hint">' + esc(c.email || '') + '</div></div>' + planBadge(c) + '</div>' +
      '<div style="margin-top:14px;">' +
      kv('Name', esc(c.name)) + kv('Business', esc(c.business_name)) + kv('Phone', c.phone ? '<a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>' : '') +
      kv('Plan', esc(c.plan)) + kv('Credits left', esc(c.purchased_credits)) + kv('Subscription ends', c.subscription_expires_at ? esc(full(c.subscription_expires_at)) : '') +
      kv('Trial comments used', esc(c.trial_comments_used)) + kv('Analyses run', esc(c.analyses)) + kv('Total paid', Number(c.paid_total) ? kes(c.paid_total) : '') +
      kv('Signed up', esc(full(c.signed_up))) + kv('Last sign-in', esc(full(c.last_sign_in_at))) + '</div>' +
      (c.email ? '<a class="btn btn-sm btn-secondary" style="margin-top:12px;" href="mailto:' + esc(c.email) + '">Email client</a>' : '') +
      ' <button class="btn btn-sm btn-secondary" style="margin-top:12px;" onclick="navigate(\'support\')">Support inbox</button></div>' +
    '<div class="card"><div class="section-label" style="margin-bottom:10px;">Activity timeline</div>' + tl + '</div></div>';
}
function viewClients() {
  if (!isAdmin()) return '<div class="page-title">Clients</div><div class="banner error">Only the platform admin can see this page.</div>';
  load(false);
  var head = '<div class="page-title">Clients &amp; activity</div><div class="page-sub">Who your clients are, what plan they\u2019re on, and everything they\u2019ve done. Visible to you only.</div>';
  if (CL.rows === null) return head + '<div class="card progress-box"><div class="spinner"></div><div class="p-sub">Loading clients\u2026</div></div>';
  if (CL.error) return head + '<div class="banner error">' + esc(CL.error) + '</div>';
  return head + (CL.selected ? detailHtml() : listHtml());
}

var searchTimer = null;
window.VQClients = {
  open: function (id) { if (!id) return; if (typeof state !== 'undefined' && state.view !== 'clients') { CL.selected = id; navigate('clients'); openClient(id); return; } openClient(id); },
  back: function () { CL.selected = null; CL.timeline = null; rerender(); },
  refresh: function () { load(true); rerender(); },
  search: function (v) { CL.q = v; clearTimeout(searchTimer); searchTimer = setTimeout(function () { rerender(); var el = document.getElementById('vqClSearch'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 250); }
};

var CSS = '.vq-cl-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.vq-cl-stat{padding:14px 16px}.vq-cl-num{font-size:22px;font-weight:800;margin-top:4px}' +
  '.vq-cl-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}@media(max-width:1000px){.vq-cl-cols{grid-template-columns:1fr}}' +
  '.vq-cl-row{cursor:pointer}.vq-cl-row:hover td{background:rgba(255,255,255,.03)}.vq-cl-feed{max-height:640px;overflow:auto}' +
  '.vq-cl-ev{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--border-soft);cursor:pointer;font-size:14px}.vq-cl-ev:hover{background:rgba(255,255,255,.03)}' +
  '.vq-cl-ic{flex:none;width:22px;text-align:center}.vq-cl-when{margin-left:auto;flex:none;color:var(--text-dim);font-size:12.5px;white-space:nowrap}.vq-cl-ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}' +
  '.vq-cl-kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:14px}.vq-cl-kv span{color:var(--text-dim)}' +
  '.vq-cl-tl{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border-soft)}.vq-cl-tl .vq-cl-when{font-size:12px}' +
  '.vq-cl-payment{border-left:3px solid var(--success);padding-left:8px}.vq-cl-support{border-left:3px solid var(--accent);padding-left:8px}';

function wire() {
  if (typeof VIEWS === 'undefined' || typeof NAV === 'undefined' || window.__vqClientsWired) return;
  window.__vqClientsWired = true;
  var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
  VIEWS.clients = viewClients;
  var host = null; NAV.forEach(function (g) { g.items.forEach(function (it) { if (it.id === 'support') host = g; }); });
  if (!host) { host = { group: '', items: [] }; NAV.push(host); }
  if (!host.items.some(function (i) { return i.id === 'clients'; })) host.items.push({ id: 'clients', label: 'Clients & activity', icon: '\uD83D\uDC65', cat: 'trust', showIf: function () { return isAdmin(); } });
  var origNavigate = window.navigate;
  window.navigate = function (view) { if (view === 'clients' && !isAdmin()) view = (typeof state !== 'undefined' && state.view) || 'overview'; if (view === 'clients' && state.view !== 'clients' && !CL.selected) CL.rows = CL.rows; return origNavigate.call(this, view); };
  try { if (typeof renderNav === 'function') renderNav(); } catch (e) {}
}
// "View activity" on each support ticket (admin only)
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest && e.target.closest('[data-vq-client]'); if (!b) return;
  e.preventDefault(); VQClients.open(b.getAttribute('data-vq-client'));
});
function later() { setTimeout(wire, 300); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', later); else later();
})();
</script>

</body>
</html>
