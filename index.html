    var name = String(file.name || '').toLowerCase();

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceIQ™ — Comment Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050D1A;
    --bg-elevated:#0D1626;
    --surface:#111C30;
    --surface-hover:#152238;
    --border:#22304A;
    --border-soft:#1A2740;
    --text:#E7ECF5;
    --text-dim:#8C9AB4;
    --text-faint:#5C6B85;
    --accent:#00D4FF;
    --accent-dim:#0A2E3D;
    --accent-text:#5CE1FF;
    --hot:#FB923C;
    --warm:#FFA500;
    --early:#60A5FA;
    --danger:#FF6B6B;
    --danger-dim:#3B1E1E;
    --success:#34D399;
    --success-dim:#12302A;
    --radius:10px;

    /* Category palette — one distinct color per intelligence module, so the
       nav, metric cards and page headers read at a glance like a color-coded
       spreadsheet dashboard rather than one monochrome accent everywhere. */
    --cat-trust:#00D4FF;   --cat-trust-dim:#0A2E3D;
    --cat-leads:#F5B942;   --cat-leads-dim:#3D2E0A;
    --cat-follow:#4FC3F7;  --cat-follow-dim:#0C2E42;
    --cat-problem:#FF6B6B; --cat-problem-dim:#3D1616;
    --cat-opp:#4ADE80;     --cat-opp-dim:#0F3320;
    --cat-risk:#B794F6;    --cat-risk-dim:#2A1F42;
    --cat-signal:#F472B6;  --cat-signal-dim:#3D1830;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',-apple-system,sans-serif;
    font-size:14.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:250px;flex:0 0 250px;
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;
    position:fixed;top:0;left:0;bottom:0;
    transform:translateX(0);
    transition:transform .22s ease;
    z-index:40;
  }
  .sidebar-brand{padding:22px 20px 18px;border-bottom:1px solid var(--border-soft);}
  .sidebar-brand .logo{font-size:18px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
  .sidebar-brand .logo .dot{width:10px;height:10px;border-radius:50%;background:conic-gradient(from 180deg, var(--cat-trust), var(--cat-leads), var(--cat-opp), var(--cat-follow), var(--cat-risk), var(--cat-trust));box-shadow:0 0 10px var(--accent);}
  .sidebar-brand .tag{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
  .sidebar-nav{flex:1;overflow-y:auto;padding:14px 12px;}
  .nav-group{margin-bottom:18px;}
  .nav-group-label{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.09em;padding:0 10px;margin-bottom:6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:8px;
    color:var(--text-dim);font-size:13.5px;font-weight:500;
    margin-bottom:2px;
  }
  .nav-item:hover{background:var(--surface-hover);color:var(--text);}
  .nav-item.active{background:var(--cat-dim, var(--accent-dim));color:var(--cat, var(--accent-text));}
  .nav-item .ic{width:17px;text-align:center;font-size:14px;color:var(--cat, currentColor);opacity:.9;}
  .nav-item .count{margin-left:auto;font-size:10.5px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--cat-dim, var(--surface-hover));color:var(--cat, var(--text-faint));padding:1px 7px;border-radius:10px;}
  .nav-item.active .count{background:var(--cat, var(--accent-text));color:var(--bg);}
  .sidebar-foot{padding:14px 20px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--text-faint);}

  .main{flex:1;margin-left:250px;min-width:0;}
  .topbar{
    display:flex;
    align-items:center;gap:18px;
    padding:12px 24px;border-bottom:1px solid var(--border-soft);
    background:var(--bg-elevated);position:sticky;top:0;z-index:30;
  }
  .hamburger{width:34px;height:34px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:16px;display:none;flex:0 0 auto;}
  .topbar-tagline{font-size:12.5px;color:var(--text-faint);white-space:nowrap;display:none;}
  .topbar-search{flex:1;max-width:420px;position:relative;display:flex;align-items:center;}
  .topbar .topbar-search input{padding-left:36px;padding-right:74px;background:var(--bg);width:100%;}
  .topbar-search .sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:14px;pointer-events:none;}
  .topbar-search-btn{position:absolute;right:4px;top:4px;bottom:4px;padding:0 12px;border-radius:6px;border:none;background:var(--cat-trust-dim);color:var(--cat-trust);font-size:11.5px;font-weight:700;}
  .topbar-search-btn:hover{background:var(--cat-trust);color:#04211D;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex:0 0 auto;}
  .bell{position:relative;width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;}
  .bell .bell-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .profile-block{display:flex;align-items:center;gap:9px;cursor:default;}
  .profile-avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--cat-trust),var(--cat-leads));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#04211D;flex:0 0 32px;}
  .profile-name{font-size:12.5px;font-weight:700;line-height:1.2;}
  .profile-company{font-size:11px;color:var(--text-faint);line-height:1.2;}
  .content{padding:28px 32px 60px;max-width:1440px;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(3,7,15,.6);z-index:35;}

  @media (max-width:900px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .hamburger{display:flex;align-items:center;justify-content:center;}
    .topbar-tagline{display:none !important;}
    .topbar-search{display:none;}
    .content{padding:20px 16px 50px;}
    .overlay.show{display:block;}
  }
  @media (min-width:901px){
    .topbar-tagline{display:block;}
  }

  /* ---------- Typography ---------- */
  .page-title{font-size:23px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;}
  .page-sub{color:var(--text-dim);font-size:14px;margin:0 0 26px;max-width:640px;}
  .section-label{font-size:12px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;}
  .step-label{display:flex;align-items:center;gap:10px;margin:24px 0 14px;font-size:13.5px;font-weight:700;color:var(--text);}
  .step-num{width:24px;height:24px;border-radius:50%;background:var(--cat-trust-dim);color:var(--cat-trust);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 24px;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px;}
  .grid-metrics{grid-template-columns:repeat(4,1fr);}
  .grid-kpi5{grid-template-columns:repeat(5,1fr);}
  @media (max-width:1100px){.grid-kpi5{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:640px){.grid-kpi5{grid-template-columns:repeat(2,1fr);}}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media (max-width:1000px){.grid-metrics{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.grid-metrics{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
  }
  .metric-card{cursor:pointer;transition:border-color .15s, transform .15s;position:relative;}
  .metric-card:hover{border-color:var(--cat, var(--accent));transform:translateY(-1px);}
  .mc-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--cat-dim, var(--accent-dim));color:var(--cat, var(--accent));margin-bottom:12px;}
  .metric-card .m-label{font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:4px;}
  .metric-card .m-value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;line-height:1.15;color:var(--text);}
  .metric-card .m-sub{font-size:11.5px;color:var(--text-dim);margin-top:8px;}
  .metric-card .m-empty{font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--text-faint);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 18px;border-radius:8px;font-weight:600;font-size:13.5px;
    border:1px solid transparent;
  }
  .btn-primary{background:var(--accent);color:#04211D;}
  .btn-primary:hover{background:var(--accent-text);}
  .btn-secondary{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-secondary:hover{border-color:var(--text-dim);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .badge-hot{background:#3A1F0F;color:var(--hot);}
  .badge-warm{background:#3B2E0A;color:var(--warm);}
  .badge-early{background:#0F2540;color:var(--early);}
  .badge-high{background:var(--danger-dim);color:var(--danger);}
  .badge-med{background:#3B2E0A;color:var(--warm);}
  .badge-low{background:var(--success-dim);color:var(--success);}
  .badge-neutral{background:var(--surface-hover);color:var(--text-dim);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty-state .ic{font-size:34px;margin-bottom:14px;opacity:.6;}
  .empty-state h3{color:var(--text);font-size:16px;margin:0 0 6px;}
  .empty-state p{font-size:13.5px;max-width:400px;margin:0 auto 18px;}

  .list-item{
    border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:10px;background:var(--surface);
  }
  .list-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
  .list-item-title{font-weight:700;font-size:14.5px;}
  .list-item-evidence{
    background:var(--bg-elevated);border-left:2px solid var(--border);
    padding:8px 12px;border-radius:4px;font-size:13px;color:var(--text-dim);
    margin:8px 0;font-style:italic;
  }
  .kv-row{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim);margin-top:6px;}
  .kv-row .k{color:var(--text-faint);}

  input[type=text],input[type=email],input[type=number],input[type=url],input[type=tel],textarea,select{
    width:100%;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:8px;padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}
  textarea{resize:vertical;min-height:150px;}
  label.field-label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text);}
  .field-hint{font-size:12px;color:var(--text-faint);margin-top:5px;}
  .field{margin-bottom:20px;}

  .choice-row{display:flex;gap:10px;flex-wrap:wrap;}
  .choice-pill{
    border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;
    color:var(--text-dim);background:var(--bg-elevated);
  }
  .choice-pill.active{border-color:var(--accent);color:var(--accent-text);background:var(--accent-dim);}
  .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:700px){.choice-grid{grid-template-columns:repeat(2,1fr);}}

  .focus-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  @media (max-width:600px){.focus-grid{grid-template-columns:1fr;}}
  .focus-chip{
    display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:8px;
    padding:9px 12px;font-size:13px;color:var(--text-dim);background:var(--bg-elevated);

<script>
/* ===== VoiceIQ submit error fix (added in version 44) ===== */
(function () {
'use strict';
/* When an analysis is refused (the free trial is used up, or another rule
   blocks it), n8n sends back a plain-English reason. The dashboard's own
   submitAnalysis only reports the HTTP status ("Server responded 403"),
   which is true but useless to read. This peeks at the real response and
   swaps in the real reason afterward -- WITHOUT re-implementing any of
   submitAnalysis's own logic (its validation, size limit and success
   handling all keep working exactly as before, unchanged and untouched).

   This has to wait until the page has fully loaded: submitAnalysis (and
   anything else that wraps it, like the size guard) is declared later in
   the file than this block, and capturing it too early would just grab
   an empty placeholder. Waiting for DOMContentLoaded guarantees every
   earlier wrapper has already been layered on by the time this runs. */
function wire() {
  if (typeof submitAnalysis !== 'function' || submitAnalysis.__vqWrapped) return;
  var origSubmit = submitAnalysis;   // already includes every earlier wrapper (e.g. the size guard)
  window.submitAnalysis = async function () {
    var betterMsg = null, realFetch = window.fetch;
    window.fetch = function (url, opts) {
      var p = realFetch(url, opts);
      if (typeof url === 'string' && url.indexOf('/voiceiq-analysis') !== -1) {
        // await the body read BEFORE handing the response back -- otherwise origSubmit can
        // see the response, throw its own generic error and set state.submitError before
        // this has finished reading the real reason, and the swap below finds nothing to fix.
        p = p.then(async function (res) {
          if (!res.ok) { try { var b = await (res.clone ? res.clone() : res).json(); if (b && b.error) betterMsg = b.error; } catch (e) {} }
          return res;
        });
      }
      return p;
    };
    try { await origSubmit.apply(this, arguments); }
    finally { window.fetch = realFetch; }
    // any real reason the server sent back is always more useful than whatever generic
    // text the existing error handling produced from the status code alone.
    if (betterMsg && typeof state !== 'undefined' && state.submitError && ((window.vqIsAdmin && vqIsAdmin()) || !(window.vqTechnical && vqTechnical(String(betterMsg))))) { state.submitError = betterMsg; try { render(); } catch (e) {} }
  };
  window.submitAnalysis.__vqWrapped = true;
}
try { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire); else wire(); } catch (e) { try { console.warn('[VoiceIQ submit error]', e); } catch (x) {} }
})();

</script>

/* ===== VoiceIQ admin-only Settings (added in version 45) ===== */
(function () {
'use strict';
/* Only the actual platform operator should see Settings -- every public
   sign-up is "admin" of their OWN business account, so that role alone
   can't be used to hide anything from a real customer.

   renderNav already has another feature layered on top of it (a run-log
   problem-count badge), so this must delegate through whatever renderNav
   already is, not replace it outright -- same lesson as the submit-error
   fix. The safest way to hide one item without touching anything else:
   the real renderNav already checks each item's own "showIf" hook, so
   toggle that hook on the Settings item only, for the duration of one
   call, then put it back exactly as it was. */
function wire() {
  if (typeof renderNav !== 'function' || typeof navigate !== 'function' || renderNav.__vqWrapped) return;
  var origRenderNav = renderNav, origNavigate = navigate;
  function findNavItem(id) {
    for (var i = 0; i < NAV.length; i++) { var items = NAV[i].items; for (var j = 0; j < items.length; j++) if (items[j].id === id) return items[j]; }
    return null;
  }

  window.renderNav = function () {
    var settingsItem = findNavItem('settings'), supportItem = findNavItem('support');
    var restore = [];
    var isAdmin = !!(window.VQAuth && VQAuth.isPlatformAdmin());
    var isSupport = !!(window.VQAuth && VQAuth.isSupportAgent && VQAuth.isSupportAgent());

    finally { restore.forEach(function (r) { if (r.had) r.it.showIf = r.prev; else delete r.it.showIf; }); }
  };

  window.navigate = function (view) {

    return origNavigate.call(this, view);
  };

<script>
/* ===== VoiceIQ hide AI vendor/infra from customers (added in version 45) ===== */
(function () {
'use strict';
/* Run Log's troubleshooting content is built entirely inside its own
   private module and was written assuming the reader is the operator --
   it names the AI vendor directly and links straight into the internal
   workflow tool. Those internal functions aren't reachable from outside
   (they're not global), so the only thing to patch is the finished page
   VIEWS.runlog hands back -- the same technique used for Settings.

   The cleanup itself is done by actually parsing the HTML into a real,
   temporary DOM and removing/replacing elements properly -- regex can't
   reliably tell where one nested <div> ends and another begins, and an
   earlier attempt at that silently mismatched and left fragments behind. */

function isAdmin() { return !!(window.VQAuth && VQAuth.isPlatformAdmin()); }

function cleanForCustomer(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;

  // the whole connection-failure banner is entirely internal-infra
  // troubleshooting -- replace it outright if present, and skip the rest
  var errBanner = tmp.querySelector('.vq-rl-err');
  if (errBanner) {
    tmp.innerHTML = '<div class="banner error">Run history isn\u2019t available right now. Please try again shortly, or contact support if this continues.</div>';
    return tmp.innerHTML;
  }

  Array.prototype.forEach.call(tmp.querySelectorAll('.vq-rl-kv'), function (el) { el.remove(); });
  Array.prototype.forEach.call(tmp.querySelectorAll('.vq-rl-pre'), function (el) { el.remove(); });
  Array.prototype.forEach.call(tmp.querySelectorAll('a.btn.btn-sm.btn-secondary'), function (el) {
    if (/Open this run in/.test(el.textContent)) el.remove();
  });
  Array.prototype.forEach.call(tmp.querySelectorAll('.vq-rl-fix'), function (el) {
    el.innerHTML = '<strong>What to do</strong><ol><li>Try running the analysis again.</li><li>If it keeps happening, contact support.</li></ol>';
  });
  Array.prototype.forEach.call(tmp.querySelectorAll('.vq-rl-sugg'), function (el) {
    el.innerHTML = '<strong>Suggested fix:</strong> Try running the analysis again.';
  });
  // the "why" line's raw text comes directly from whatever the AI provider's
  // own API returned -- there's no reliable way to predict every phrasing
  // that might name it, so replace it unconditionally rather than scan for
  // known vendor words. The status chip right next to it (Failed / Partial /
  // Couldn't be read) already tells the person what actually happened.
  Array.prototype.forEach.call(tmp.querySelectorAll('.vq-rl-why'), function (el) {
    var firstNode = el.childNodes[0];
    if (firstNode && firstNode.nodeType === 3) firstNode.textContent = 'This run had a problem.';
  });

  return tmp.innerHTML;
}

function wire() {
  if (typeof VIEWS === 'undefined' || !VIEWS.runlog || VIEWS.runlog.__vqWrapped) return;
  var origViewRunLog = VIEWS.runlog;
  var wrapped = function () {
    var html = origViewRunLog.apply(this, arguments);

  };
  wrapped.__vqWrapped = true;
  VIEWS.runlog = wrapped;
}
try { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire); else wire(); } catch (e) { try { console.warn('[VoiceIQ hideprovider]', e); } catch (x) {} }
document.addEventListener('DOMContentLoaded', function () { setTimeout(wire, 80); });
})();

<script>
/* ===== VoiceIQ affected people per problem (added in version 45) ===== */
(function () {
'use strict';
/* Recurring Problems only ever showed an aggregated count and one quote --
   no way to see WHICH specific people raised a given problem, so there was
   no way to actually go respond to them individually. The AI now returns
   this per problem when the source data has real names/handles to work
   with; this adds it to the page without touching the existing rendering. */

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function addAffectedPeople(html) {
  var c = (typeof state !== 'undefined') && state.current;
  if (!c || !Array.isArray(c.problems) || !c.problems.length) return html;
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var items = tmp.querySelectorAll('.list-item');
  for (var i = 0; i < items.length && i < c.problems.length; i++) {
    var people = clean(c.problems[i] && c.problems[i].affected_people);
    if (!people.length) continue;
    var block = document.createElement('div');
    block.className = 'vq-ap';
    block.innerHTML = buildBlock(people, c.problems[i]);
    items[i].appendChild(block);
  }
  return tmp.innerHTML;
}

/* one entry per person and quote; "@Full Name" shown as "Full Name", real @handles kept */
function clean(list) {
  if (!Array.isArray(list)) return [];
  var seen = {}, out = [];
  list.forEach(function (p) {
    if (!p) return;
    var raw = String(p.handle || '').trim(), quote = String(p.quote || '').trim();
    if (!raw && !quote) return;
    var name = /\s/.test(raw.replace(/^@/, '')) ? raw.replace(/^@/, '') : raw;
    if (!name) name = 'Someone';
    var key = name.toLowerCase() + '|' + quote.toLowerCase();
    if (seen[key]) return; seen[key] = 1;
    out.push({ name: name, quote: quote });
  });
  return out;
}

<script>
/* ===== VoiceIQ multi-source upload (added in version 45) ===== */
(function () {
'use strict';
/* Lets someone bring feedback from more than one place into a single
   analysis -- WhatsApp exports, Google Reviews, surveys, customer-care
   notes -- as a file upload OR pasted text, tagged with its source.
   ONE textarea only: the existing "Comments or Reviews" box. A file
   upload's extracted text is tagged and inserted right into that same
   box; "Tag & continue" wraps whatever's currently typed there with
   the chosen source and leaves it ready to paste the next batch below
   it -- no separate staging box, ever. */

var EXTRA_SOURCES = ['WhatsApp','Complaints','Survey','Website Reviews','DMs','Support Messages','Campaign','Competitor','Other'];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* ---- libraries load lazily, only the first time they're actually needed,
   so nobody pays for ~2.5MB of spreadsheet/PDF code just to open the page ---- */
var loadingPromises = {};
function loadScript(url) {
  if (loadingPromises[url]) return loadingPromises[url];
  loadingPromises[url] = new Promise(function (resolve, reject) {
    var el = document.createElement('script');
    el.src = url; el.onload = function () { resolve(); }; el.onerror = function () { reject(new Error('Could not load a required library. Check your connection and try again.')); };
    document.head.appendChild(el);
  });
  return loadingPromises[url];
}
async function ensureXLSX() { if (!window.XLSX) await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'); }
async function ensurePdfJs() {
  if (!window.pdfjsLib) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
}

/* ---- extraction: each returns plain text, or throws with a clear message ---- */
async function extractFromFile(file) {
  var name = (file.name || '').toLowerCase();
  if (name.endsWith('.txt')) return await file.text();
  if (name.endsWith('.csv')) return await extractFromSheet(file);
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) return await extractFromSheet(file);
  if (name.endsWith('.pdf')) return await extractFromPdf(file);

}
async function extractFromSheet(file) {
  await ensureXLSX();
  var buf = await file.arrayBuffer();
  var wb = XLSX.read(buf, { type: 'array' });
  var out = [], note = null;
  wb.SheetNames.forEach(function (sheetName) {
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, blankrows: false });
    if (!rows.length) return;
    var picked = pickColumns(rows);
    if (picked) {
      if (!note) note = picked.note;
      rows.slice(picked.startRow).forEach(function (row) {
        var text = clean(row[picked.text]); if (!text) return;

      rows.forEach(function (row) {
        var line = row.filter(function (c) { return c !== null && c !== undefined && String(c).trim(); })

/* a scraped sheet usually has one column of real comments and several of links, ids and icons */
function clean(v) {

  if (/^https?:\/\/\S*$/i.test(t)) return '';             /* a bare link */

}
function looksLink(v) { var t = String(v == null ? '' : v).trim(); return /^https?:\/\//i.test(t) || /^data:/i.test(t); }
function looksTime(v) { var t = String(v == null ? '' : v).trim(); return /^\d{1,3}\s*(m|min|mins|h|hr|hrs|d|w|y)$/i.test(t) || /^(just now|yesterday|today)$/i.test(t) || /^\d{1,2}\s+\w+(\s+\d{4})?$/.test(t) || /^\d{4}-\d{2}-\d{2}/.test(t) || /\b(ago)\b/i.test(t); }
function looksName(v) { var t = String(v == null ? '' : v).trim(); return t.length > 1 && t.length <= 42 && !/[.!?]{1}\s/.test(t) && t.split(/\s+/).length <= 5 && !/^\d+$/.test(t); }

  }
  var headerLooksLabels = head.every(function (c) { return typeof c === 'string' && String(c).length < 60 && !/^https?:/i.test(String(c)); });
  var startRow = headerLooksLabels ? 1 : 0;

    var vals = body.map(function (r) { return (r || [])[c]; }).filter(function (v) { return v != null && String(v).trim(); });

  whenCand.sort(function (a, b) { return (/date|time|when|posted/.test(b.label) ? 1 : 0) - (/date|time|when|posted/.test(a.label) ? 1 : 0); });

    text: textCol, who: whoCand[0] ? whoCand[0].i : null, when: whenCand[0] ? whenCand[0].i : null, startRow: startRow,

}
async function extractFromPdf(file) {
  await ensurePdfJs();

function appendToMainTextarea(taggedText) {
  var current = (state.newAnalysis.comments || '').trim();

    '<button type="button" id="vqUploadIconBtn" class="btn btn-sm btn-secondary" title="Upload a file (.txt, .csv, .xlsx, .pdf)" style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;" onclick="document.getElementById(\'vqSrcFile\').click()">' +

window.VQMultiSource = window.VQMultiSource || {};

/* Wraps only the newly-typed, not-yet-tagged tail of the main textarea

/* Platform sent with the analysis = the source(s) the person actually chose.

function wire() {
  // A flag on window, not on the VIEWS entry itself -- another module's
  // own wrapper can replace VIEWS['new-analysis'] with a brand new
  // function object that doesn't carry this module's flag forward,
  // which would otherwise let this run twice and inject the block twice.
  if (typeof VIEWS === 'undefined' || !VIEWS['new-analysis'] || window.__vqMultisourceWired) return;
  var origView = VIEWS['new-analysis'];
  var wrapped = function () {
    var html = origView.apply(this, arguments);

      if (!f || f.sourceType !== 'Paste Comments') return html;

      var textareaLabel = Array.prototype.find.call(tmp.querySelectorAll('.field-label'), function (el) { return el.textContent.trim() === 'Comments or Reviews'; });

})();

var SUPA_URL = 'https://xjfbytiyzpeijbpnfhuc.supabase.co';

/* If there's a payment still pending, poll for it to confirm and

async function pollPendingPayment(sess) {
  try {
    var r = await fetch(SUPA_URL + '/rest/v1/payment_intents?select=status&order=created_at.desc&limit=1', { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + sess.access_token } });
    var rows = await r.json().catch(function () { return []; });
    var latest = Array.isArray(rows) && rows[0];

  var attempts = 0;

    attempts++;
    if (attempts > 24) { clearInterval(interval); return; } // ~2 minutes at 5s each
    try {
      var r2 = await fetch(SUPA_URL + '/rest/v1/payment_intents?select=status&order=created_at.desc&limit=1', { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + sess.access_token } });

    '<button type="button" class="btn btn-sm btn-secondary" onclick="VQSupport.revokeAgent(\'' + esc(email).replace(/'/g, "\\'") + '\', this)">Remove</button>' +
  '</div>';
}

function loadAgentsList() {
  var sess = getSess();
  var box = document.getElementById('vqAgentsList');
  if (!sess || !box) return;
  fetch(SUPA_URL + '/rest/v1/rpc/list_support_agents', { method: 'POST', headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + sess.access_token, 'Content-Type': 'application/json' }, body: '{}' })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      var fresh = document.getElementById('vqAgentsList');
      if (!fresh) return;
      if (!Array.isArray(rows) || !rows.length) { fresh.innerHTML = '<div class="vq-acct-dim">Nobody else has been given access yet.</div>'; return; }
      fresh.innerHTML = rows.map(function (r) { return agentRowHtml(r.email); }).join('');
    })
    .catch(function () { var fresh = document.getElementById('vqAgentsList'); if (fresh) fresh.innerHTML = '<div class="field-hint">Couldn\u2019t load this right now.</div>'; });
}

window.VQSupport.grantAgent = function () {
  var sess = getSess();
  var input = document.getElementById('vqAgentEmailInput');
  var msg = document.getElementById('vqAgentMsg');
  var email = (input && input.value || '').trim();
  if (!email) { msg.innerHTML = '<div class="banner error" style="margin-bottom:0;">Type an email first.</div>'; return; }
  msg.innerHTML = '<div class="vq-acct-dim">Adding\u2026</div>';
  fetch(SUPA_URL + '/rest/v1/rpc/set_support_agent', { method: 'POST', headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + sess.access_token, 'Content-Type': 'application/json' }, body: JSON.stringify({ target_email: email, is_agent: true }) })
    .then(function (r) { return r.text().then(function (raw) { if (!r.ok) throw new Error(raw ? JSON.parse(raw).hint || raw.slice(0, 150) : 'Server responded ' + r.status); }); })
    .then(function () {
      var freshMsg = document.getElementById('vqAgentMsg');
      if (freshMsg) freshMsg.innerHTML = '<div class="banner success" style="margin-bottom:0;">Added.</div>';
      if (input) input.value = '';
      loadAgentsList();
    })
    .catch(function (e) {
      var freshMsg = document.getElementById('vqAgentMsg');
      if (freshMsg) freshMsg.innerHTML = '<div class="banner error" style="margin-bottom:0;">' + esc(e.message) + '</div>';
    });
};

window.VQSupport.revokeAgent = function (email, btn) {
  var sess = getSess();
  btn.disabled = true; btn.textContent = 'Removing\u2026';
  fetch(SUPA_URL + '/rest/v1/rpc/set_support_agent', { method: 'POST', headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + sess.access_token, 'Content-Type': 'application/json' }, body: JSON.stringify({ target_email: email, is_agent: false }) })
    .then(function (r) { if (!r.ok) throw new Error('Server responded ' + r.status); loadAgentsList(); })
    .catch(function () { btn.disabled = false; btn.textContent = 'Remove'; });
};

/* ---- the dedicated Support view, separate from admin-only Settings so
   a support agent who isn't also the platform admin can still reach it ---- */
function supportViewHtml() {
  var isAdmin = !!(window.VQAuth && VQAuth.isPlatformAdmin && VQAuth.isPlatformAdmin());
  var html = '<div class="page-title">Support Requests</div><div class="page-sub">Customer messages. Tickets waiting for a reply are shown first.</div>' +

      '<div id="vqAgentsList" style="margin-top:14px;"><div class="vq-acct-dim">Loading\u2026</div></div>' +

}

function wireSupportView() {
  if (typeof VIEWS === 'undefined' || window.__vqSupportViewWired) return;
  window.__vqSupportViewWired = true;
  VIEWS.support = function () {
    setTimeout(function () {
      loadAdminMessages();

    }, 0);
    return supportViewHtml();
  };
}

function wire() { wireAccountView(); wireSupportView(); }
try { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire); else wire(); } catch (e) {}
document.addEventListener('DOMContentLoaded', function () { setTimeout(wire, 80); });
})();

  if(!q.trim()) return;

      'lead':'leads', 'leads':'leads',
      'follow-up':'followups', 'followup':'followups', 'follow up':'followups', 'follow-ups':'followups', 'followups':'followups',
      'complaint':'problems', 'complaints':'problems', 'problem':'problems', 'problems':'problems',
      'demand':'opportunities', 'demands':'opportunities', 'opportunity':'opportunities', 'opportunities':'opportunities',
      'risk':'behavior', 'risks':'behavior'
    };
    const matched = catAliases[q.trim().toLowerCase()];
    if(matched){
      state.conv.filter = new Set([matched]);
      state.conv.search = '';

}

/* =========================================================================

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function n(v, fallback){ const x = Number(v); return isNaN(x) ? (fallback ?? '—') : x; }
function safeParseArr(v){
  if(!v) return [];

  try{ const p = JSON.parse(v); return Array.isArray(p) ? p : []; }catch(e){ return []; }
}
function base(){ return (state.webhookBase || '').replace(/\/+$/,''); }
function isPlaceholderBase(){ return !state.webhookBase || state.webhookBase.indexOf('REPLACE-WITH') !== -1; } // the built-in default is only a real address once someone has actually filled it in

  if(v==='low') return `<span class="badge badge-low">${esc(p)}</span>`;
  return `<span class="badge badge-neutral">${esc(p||'—')}</span>`;
}
function tempBadge(t){
  const v = (t||'').toUpperCase();
  if(v==='HOT') return `<span class="badge badge-hot">HOT</span>`;
  if(v==='WARM') return `<span class="badge badge-warm">WARM</span>`;
  if(v==='EARLY') return `<span class="badge badge-early">EARLY</span>`;

}

/* =========================================================================

function navigate(view){
  state.view = view;

  window.scrollTo(0,0);
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

function renderNav(){
  const c = state.current;
  const counts = c ? {
    leadsCount: c.leadsCount, followupsCount: c.followupsCount,
    problemsCount: c.problemsCount, oppsCount: c.oppsCount,
    questionsAskedCount: (c.questionsAsked || []).length || undefined
  } : {};
  let html = '';
  NAV.forEach(g=>{
    const items = g.items.filter(it => !it.showIf || it.showIf(c));
    if(!items.length) return;
    html += `<div class="nav-group">`;
    if(g.group) html += `<div class="nav-group-label">${g.group}</div>`;
    items.forEach(it=>{
      const active = state.view===it.id ? 'active' : '';
      const count = it.countKey && counts[it.countKey] !== undefined ? `<span class="count">${counts[it.countKey]}</span>` : '';
      html += `<a class="nav-item ${active}" style="${catStyle(it.cat)}" onclick="navigate('${it.id}')"><span class="ic">${it.icon}</span>${vqT(it.label)}${count}</a>`;
    });

async function submitAnalysis(){
  if(window.__vqSubmitLock || state.submitting) return;   /* a second click or call while one is starting or running does nothing */
  window.__vqSubmitLock = true;
  try { return await submitAnalysisInner(); } finally { window.__vqSubmitLock = false; }
}
async function submitAnalysisInner(){
  if(!hasBase()){ state.submitError = vqNoBaseMsg(); render(); return; }
  const f = state.newAnalysis;
  if(f.sourceType==='Paste Comments' && !f.comments.trim()){ state.submitError='Paste some comments or reviews first.'; render(); return; }
  if(f.sourceType==='Scrape from URL' && !f.postUrl.trim()){ state.submitError='Add a post or review URL to scrape.'; render(); return; }
  if(!f.name.trim() || !f.email.trim()){ state.submitError='Your name/company and email are required.'; render(); return; }

  // Large analysis: more than 200 comments are analysed in batches of about 200 (each batch = one run)
  const est = window.VQLarge ? VQLarge.estimate(f) : { comments: 0, batches: 1 };
  if (est.batches > 1 && !VQLarge.confirm(est)) return;
  const historyBefore = window.VQLarge ? await VQLarge.snapshot() : null;
  const startedAt = Date.now();

  state.submitting = true; state.submitError = null;
  render();

  const payload = {
    'Comments or Reviews': window.VQSec ? VQSec.cleanText(f.comments) : f.comments,
    'Your Name or Company': f.name,
    'Email': f.email,
    'Analysis Type': f.sourceType,
    'Post URL': f.postUrl,
    'Platform': (window.VQMultiSource && typeof window.VQMultiSource.derivePlatform === 'function') ? window.VQMultiSource.derivePlatform(f) : f.platform,
    'Max Comments': f.maxComments,
    'Context Type': f.contextType
  };

  try{
    /* Long connections get cut by tunnels and proxies, so stop waiting on the connection
       after 75 seconds and watch for the saved result instead. The analysis keeps running. */
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const giveUp = setTimeout(function () { try { ctrl && ctrl.abort(); } catch (e) {} }, 75000);
    let res;
    try {
      res = await fetch(base() + '/voiceiq-analysis', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      });
    } finally { clearTimeout(giveUp); }
    if(res.status === 202 && window.VQLarge){ // large analysis accepted: it runs in the background
      let info = {}; try { info = await res.json(); } catch(e) {}
      state.submitting = false; render();
      VQLarge.watch({ before: historyBefore, batches: info.batches || est.batches, comments: info.comments || est.comments, startedAt });
      return;
    }
    if(!res.ok && [502,503,504,520,522,524].indexOf(res.status) !== -1 && window.VQLarge){ // the connection timed out but the analysis keeps running
      state.submitting = false; render();
      VQLarge.watch({ before: historyBefore, batches: est.batches, comments: est.comments, startedAt, slow: true });
      return;
    }
    if(!res.ok) throw new Error('Server responded ' + res.status);
    const data = await res.json();
    const row = Array.isArray(data) ? data[0] : data;
    state.current = normalizeFromWebhook(row, f.comments);
    try { if (window.vqRecordRun) vqRecordRun(est.comments, Date.now() - startedAt); } catch (e) {}
    state.conv = {filter: new Set(), search: '', expanded: new Set()};
    state.leadStatus = {}; state.followupStatus = {};
    state.submitting = false;
    navigate('overview');
  }catch(err){
    state.submitting = false;
    if (window.VQLarge && (err && (err.name === 'AbortError' || /abort/i.test(String(err.message)))) ) { // we stopped waiting on the connection; the analysis is still running
      render(); VQLarge.watch({ before: historyBefore, batches: est.batches, comments: est.comments, startedAt, slow: true }); return;
    }
    if (window.VQLarge && /fetch|network/i.test(String(err && err.message)) && Date.now() - startedAt > 60000) { // connection dropped during a long run: keep watching for the result
      render(); VQLarge.watch({ before: historyBefore, batches: est.batches, comments: est.comments, startedAt, slow: true }); return;
    }
    state.submitError = window.vqErr('complete your analysis', err, 'Check your webhook URL in Settings and that the workflow is active.');
    render();
  }
}

async function fetchHistory(force){
  if(state.history && !force) return;
  if(state.fetchingHistory && !force) return; // a manual Refresh click always proceeds, even if a stale background fetch got stuck
  if(!hasBase()){ state.historyError=vqNoBaseMsg(); render(); return; }
  state.fetchingHistory = true;
  state.historyError = null;
  try{
    const PAGE = 60;
    const res = await fetch(base() + '/voiceiq-history?limit=' + PAGE, {method:'GET'});
    if(!res.ok) throw new Error('Server responded ' + res.status);
    const data = await res.json();
    const rows = Array.isArray(data) ? data : [];
    state.historyMore = rows.length >= PAGE;            /* a full page probably means there are older ones */
    state.history = rows.reverse();
    state.compare = null;
  }catch(err){
    state.historyError = window.vqErr('load your analysis history', err);
    state.history = [];
  }
  state.fetchingHistory = false;
  render();
}

/* ===== One error voice for the whole dashboard (v47) =====
   Admin  : every technical detail, exactly as the system reported it.
   Client : what went wrong in plain words, then "try again or contact support". */
function vqRaw(err){ return (err && err.message) ? String(err.message) : String(err == null ? '' : err); }
function vqTechnical(raw){
  return /(?:HTTP|status|code|error|responded)\s*:?\s*[45]\d\d\b|^\s*[45]\d\d\b|failed to fetch|networkerror|load failed|\bjson\b|unexpected token|undefined|typeerror|referenceerror|syntaxerror|\brls\b|row-level|violates|\brelation "|\bcolumn "|supabase|n8n|webhook|workflow|gemini|claude|\bAI\b|stack trace|\bfetch\b|abort|timeout|timed out|econn|ERR_|\bsql\b|postgres|jwt|api.?key|credential|migration|permission denied|pgrst|googleapis|bad request|internal server|bad gateway/i.test(raw);
}
function vqFriendlyReason(raw){
  if (/failed to fetch|networkerror|network request failed|load failed|ERR_|econn|timed? ?out|timeout|abort/i.test(raw)) return 'VoiceIQ couldn\u2019t be reached. This can be your internet connection or a short outage.';
  if (/(?:HTTP|status|code|error|responded)\s*:?\s*40[13]\b|jwt|not signed in|session|unauthori[sz]ed|expired/i.test(raw)) return 'Your session may have expired \u2014 please sign in again.';
  if (/(?:HTTP|status|code|error|responded)\s*:?\s*429\b|too many requests|rate.?limit/i.test(raw)) return 'There were too many attempts in a short time. Wait a minute and try again.';
  if (/(?:HTTP|status|code|error|responded)\s*:?\s*413\b|payload too large|request entity too large/i.test(raw)) return 'That is too big to process in one go. Try a smaller amount.';
  if (vqTechnical(raw)) return '';
  var t = String(raw || '').replace(/\s+/g, ' ').trim();
  return (t && t.length <= 160) ? t.replace(/[.!?\s]*$/, '.') : '';
}
function vqErr(action, err, adminExtra){
  var raw = vqRaw(err);
  if (vqIsAdmin()) return 'Couldn\u2019t ' + action + (raw ? ': ' + raw : '') + (adminExtra ? ' ' + adminExtra : '');
  var why = vqFriendlyReason(raw);
  var out = 'We couldn\u2019t ' + action + '. ' + (why ? why + ' ' : '') + 'Please try again, or contact support if it keeps happening.';
  try { window.__vqLastError = { text: out, at: Date.now() }; } catch (e) {}
  return out;
}
function vqContactSupport(){
  try { window.__vqOpenSection = 'support'; navigate('account'); } catch (e) {}
  try {
    var le = window.__vqLastError;
    if (le && Date.now() - le.at < 10 * 60 * 1000) setTimeout(function(){
      var ta = document.getElementById('vqSupportInput');
      if (ta && !ta.value) {
        var t = new Date(le.at), hh = ('0' + t.getHours()).slice(-2), mm = ('0' + t.getMinutes()).slice(-2);
        ta.value = 'I ran into a problem: ' + le.text.replace(/\s*Please try again, or contact support if it keeps happening\.$/, '') + ' (at ' + hh + ':' + mm + ')\n\nWhat I was doing: ';
        try { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
      }
    }, 350);
  } catch (e) {}
}

function trendLine(currentVal, prevVal){
  if(prevVal===undefined || prevVal===null || prevVal==='' || isNaN(Number(prevVal))) return '';
  const p = Number(prevVal), cur = Number(currentVal)||0;
  if(p===0 && cur===0) return '';

  if(pct===0) return `<span style="color:var(--text-faint);">No change vs last analysis</span>`;
  const up = pct>0;
  return `<span style="color:${up?'var(--success)':'var(--danger)'};">${up?'↑':'↓'} ${Math.abs(pct)}% vs last analysis</span>`;
}

function healthGaugeSVG(score){

  const total = P+N+U || 1;
  const r = 34, C = 2*Math.PI*r;
  const pLen = (P/total)*C, nLen = (N/total)*C, uLen = (U/total)*C;
  if(P+N+U === 0){
    return `<svg width="80" height="80" viewBox="0 0 80 80" style="flex:0 0 80px;">
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"/>
    </svg>`;
  }
  return `<svg width="80" height="80" viewBox="0 0 80 80" style="flex:0 0 80px;transform:rotate(-90deg);">
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--danger)" stroke-width="10"
      stroke-dasharray="${nLen} ${C-nLen}" stroke-dashoffset="0"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--success)" stroke-width="10"
      stroke-dasharray="${pLen} ${C-pLen}" stroke-dashoffset="${-nLen}"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--text-faint)" stroke-width="10"
      stroke-dasharray="${uLen} ${C-uLen}" stroke-dashoffset="${-(nLen+pLen)}"/>
  </svg>`;
}

/* Conversations: real category filters built from the verbatim quotes Claude
   already puts inside leads/follow_ups/recurring_problems/opportunities/
   behavior_signals — no backend changes, no fabricated per-comment sentiment. */
const CONV_CATS = [
  {key:'leads', label:'Lead', cat:'leads', field:'evidence'},
  {key:'followups', label:'Follow-up', cat:'follow', field:'evidence'},
  {key:'problems', label:'Complaint', cat:'problem', field:'evidence'},
  {key:'opportunities', label:'Demand', cat:'opp', field:'evidence'},
  {key:'behavior', label:'Risk signal', cat:'risk', field:'comment_excerpt'}
];
function normQuote(s){
  return (s||'').toLowerCase().replace(/['"“”‘’]/g,'').replace(/\s+/g,' ').trim();
}
/* A line "matches" a quote if a meaningful chunk of one contains the other —
   handles Claude quoting a slightly trimmed or lightly reworded fragment. */
function quoteMatches(line, quote){
  const l = normQuote(line), q = normQuote(quote);
  if(!l || !q || q.length < 10) return false;
  const chunk = q.length > 50 ? q.slice(0, 50) : q;
  return l.includes(chunk) || q.includes(l.slice(0, Math.min(50, l.length)));
}
function tagConversationLine(line, c){
  const tags = [];
  CONV_CATS.forEach(({key, label, cat, field}) => {
    (c[key] || []).forEach(item => {
      if(item[field] && quoteMatches(line, item[field])){
        tags.push({key, label, cat, item});
      }
    });
  });
  return tags;
}

function lineChartSVG(values, color, width, height){
  const w = width || 560, h = height || 110, pad = 20;
  const nums = values.map(v => Number(v)||0);
  const max = Math.max(1, ...nums), min = Math.min(0, ...nums);
  const range = (max - min) || 1;
  const stepX = nums.length > 1 ? (w - pad*2) / (nums.length - 1) : 0;
  const xy = nums.map((v,i) => [pad + i*stepX, h - pad - ((v-min)/range)*(h-pad*2)]);
  const points = xy.map(p=>p.join(',')).join(' ');
  const dots = xy.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="${color}"/>`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%;">
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
  </svg>`;
}
function trendCard(title, cat, series, dates){
  const vals = series.map(v=>Number(v)||0);
  const last = vals[vals.length-1], prev = vals[vals.length-2];
  const trend = (vals.length>1) ? trendLine(last, prev) : '';
  return `<div class="card" style="margin-bottom:14px;">
    <div class="widget-head" style="margin-bottom:8px;">
      <div><h3 style="font-size:13.5px;">${title}</h3></div>
      <div class="mono" style="font-size:18px;font-weight:700;color:var(${CAT_VARS[cat][0]});">${last}</div>
    </div>
    ${lineChartSVG(vals, `var(${CAT_VARS[cat][0]})`)}
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:4px;">
      <span>${esc(dates[0]||'')}</span><span>${esc(dates[dates.length-1]||'')}</span>
    </div>
    ${trend ? `<div style="margin-top:6px;font-size:12px;">${trend}</div>` : ''}
  </div>`;
}
function buildSignalTimeline(g, dates){
  const lines = [];
  const metrics = [
    {label:'Recurring Problems', key:'Recurring Problems Count'},
    {label:'Critical/high-urgency signals', key:'Critical Urgency Count'},
    {label:'Leads detected', key:'Leads Detected'},
    {label:'Opportunities found', key:'Opportunities Count'}
  ];
  metrics.forEach(m=>{
    const vals = g.map(r=>Number(r[m.key])||0);
    const first = vals[0], last = vals[vals.length-1];
    if(first===last) return;
    const dir = last>first ? 'grew from' : 'fell from';
    lines.push(`${m.label} ${dir} ${first} on ${dates[0]} to ${last} by ${dates[dates.length-1]}.`);
  });
  return lines;
}

async function loadUnresolvedSignals(){
  const company = state.trendCompany;
  const rows = (state.history||[]).filter(r=>(r['Your Name or Company']||'').trim()===company);
  rows.sort((a,b)=> new Date(b['Analysis Date']||0) - new Date(a['Analysis Date']||0));
  const recent = rows.slice(0,3);
  if(recent.length < 2){
    state.unresolvedSignals = { loading:false, error:null, items:[], checkedCount: recent.length, note: 'Needs at least 2 analyses of this entity to check for recurrence.' };
    render();
    return;
  }
  state.unresolvedSignals = { loading:true, error:null, items:[], checkedCount: recent.length };
  render();
  try{
    const fulls = [];
    for(const r of recent){
      const id = r['Analysis ID'];
      if(!id) continue;
      const res = await fetch(base() + '/voiceiq-detail?id=' + encodeURIComponent(id), {method:'GET'});
      if(!res.ok) continue;
      const full = await res.json();
      fulls.push(full);
    }
    const problemLists = fulls.map(f => { try { return JSON.parse(f['Recurring Problems JSON']||'[]'); } catch(e){ return []; } });
    const latest = problemLists[0] || [];
    const items = [];
    latest.forEach(p=>{
      const nameNorm = (p.problem||'').toLowerCase();
      if(!nameNorm) return;
      let streak = 1;
      for(let i=1;i<problemLists.length;i++){
        const found = problemLists[i].some(op => (op.problem||'').toLowerCase().includes(nameNorm.slice(0,15)) || nameNorm.includes((op.problem||'').toLowerCase().slice(0,15)));
        if(found) streak++; else break;
      }
      if(streak >= 2){
        items.push({ problem: p.problem, streak, evidence: p.evidence, recommended_action: p.recommended_action });
      }
    });
    state.unresolvedSignals = { loading:false, error:null, items, checkedCount: fulls.length };
  }catch(err){
    state.unresolvedSignals = { loading:false, error: window.vqErr('check which concerns keep coming back', err), items: [], checkedCount: recent.length };
  }
  render();
}

function viewSignals(){
  const c = state.current;
  if(!c) return moduleShell('Signals','Intent, urgency, revenue leakage and competitor mentions from this analysis.','◎');
  const intent = intentGroups(c);
  const urgent = [...(c.urgencySignals||[])].sort((a,b)=>{
    const order = {critical:0, high:1, medium:2, low:3};
    return (order[(a.urgency||'').toLowerCase()]??9) - (order[(b.urgency||'').toLowerCase()]??9);
  });
  const JOURNEY_STAGES = [
    ['discovery','Discovery'],['inquiry','Inquiry'],['purchase','Purchase'],['payment','Payment'],
    ['delivery','Delivery'],['usage','Product/Service Usage'],['support','Customer Support'],
    ['repeat_purchase','Repeat Purchase'],['cancellation','Cancellation / Exit']

  const jd = c.journeyDistribution || {};
  const jdValues = JOURNEY_STAGES.map(([k])=>Number(jd[k])||0);

  const jdHasData = jdValues.some(v=>v>0);

  return `${pageTitleHtml('◎','Signals')}<div class="page-sub">What customers are trying to do, what needs urgent attention, where sales may be slipping away, and who they're comparing you to.</div>

  if(!c) return moduleShell('Conversations','Search and browse the original comments or reviews for this analysis.','≡');
  if(!c.rawComments || !c.rawComments.trim()){
    return `${pageTitleHtml('≡','Conversations')}<div class="page-sub">Search and browse the original comments or reviews for this analysis.</div>
      <div class="card empty-state"><div class="ic">≡</div><h3>Original text not available.</h3>
      <p>${c.isHistorical ? "This analysis was scraped from a URL and the raw text wasn't stored, or predates raw-text storage." : "No raw comments were submitted with this analysis."}</p></div>`;
  }
  if(!state.conv) state.conv = {filter: new Set(), search: '', expanded: new Set()};
  const lines = c.rawComments.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const tagged = lines.map(line => ({line, tags: tagConversationLine(line, c)}));

  return `${pageTitleHtml('≡','Conversations')}<div class="page-sub">Original text is preserved exactly as submitted — ${lines.length} entries. Tags are matched from the exact quotes already in your Leads/Follow-ups/Problems/Opportunities/Risks data.</div>
    <div class="field" style="max-width:420px;">
      <input type="text" placeholder="Search conversations..." value="${esc(state.conv.search)}" oninput="convSetSearch(this.value)">
    </div>
    <div class="choice-row" style="margin-bottom:18px;">
      <button class="choice-pill ${state.conv.filter.size===0?'active':''}" onclick="convClearFilter()">All</button>
      ${CONV_CATS.map(({key,label,cat}) => {
        const count = tagged.filter(t => t.tags.some(tg=>tg.key===key)).length;
        if(count===0) return '';
        const active = state.conv.filter.has(key);
        return `<button class="choice-pill" style="${active?`border-color:var(${CAT_VARS[cat][0]});color:var(${CAT_VARS[cat][0]});background:var(${CAT_VARS[cat][1]});`:''}" onclick="convToggleFilter('${key}')">${label} <span class="mono" style="opacity:.7;">${count}</span></button>`;
      }).join('')}
    </div>
    <div id="convList">${renderConvList(tagged)}</div>`;
}
function renderConvList(tagged){
  const q = (state.conv.search||'').toLowerCase();
  const activeFilters = state.conv.filter;
  const rows = tagged
    .map((t, i) => ({...t, i}))
    .filter(({line, tags}) => {
      if(q && !line.toLowerCase().includes(q)) return false;
      if(activeFilters.size>0 && !tags.some(t=>activeFilters.has(t.key))) return false;
      return true;
    });
  if(!rows.length){
    return `<div class="card empty-state"><div class="ic">≡</div><h3>No conversations match.</h3><p>Try a different search or clear the filters.</p></div>`;
  }
  return rows.map(({line, tags, i}) => {
    const expanded = state.conv.expanded.has(i);
    const tagBadges = tags.map(t =>
      `<span class="badge" style="background:var(${CAT_VARS[t.cat][1]});color:var(${CAT_VARS[t.cat][0]});cursor:pointer;" onclick="convToggleExpand(${i})">${t.label}</span>`
    ).join(' ');
    const detail = expanded && tags.length ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px;">
      ${tags.map(t => `<div style="font-size:12.5px;">
        <span class="badge" style="background:var(${CAT_VARS[t.cat][1]});color:var(${CAT_VARS[t.cat][0]});">${t.label}</span>
        <span style="color:var(--text-dim);margin-left:6px;">${esc(t.item.recommended_action || t.item.likely_meaning || t.item.business_opportunity || '')}</span>
        ${t.item.priority ? priorityBadge(t.item.priority) : ''}
      </div>`).join('')}
    </div>` : '';
    return `<div class="conv-item">
      ${esc(line)}
      ${tags.length ? `<div class="conv-tags">${tagBadges}</div>${detail}` : ''}
    </div>`;
  }).join('');
}
function convSetSearch(v){ state.conv.search = v; document.getElementById('convList').innerHTML = renderConvList(computeTagged()); }
function convToggleFilter(key){
  if(state.conv.filter.has(key) && state.conv.filter.size===1){
    state.conv.filter.clear(); // clicking the already-active single filter goes back to All
  } else {
    state.conv.filter = new Set([key]); // single-select: pick one category at a time, not additive
    state.conv.search = '';
  }
  render();
}
function convClearFilter(){ state.conv.filter.clear(); render(); }
function convToggleExpand(i){
  if(state.conv.expanded.has(i)) state.conv.expanded.delete(i); else state.conv.expanded.add(i);
  document.getElementById('convList').innerHTML = renderConvList(computeTagged());
}
function computeTagged(){
  const c = state.current;
  const lines = c.rawComments.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  return lines.map(line => ({line, tags: tagConversationLine(line, c)}));
}

/* =========================================================================
   Compare two analyses (added after v45)
   Pick any two runs -> metric changes (better / worse / same) plus which
   recurring problems are new, resolved, or still there, and which
   opportunities are new. Metrics come from the history list itself; the
   problem/opportunity lists are fetched on demand via voiceiq-detail.
========================================================================= */
const CMP_METRICS = [
  { key:'Health Score',             label:'Health score',          better:'up'   },
  { key:'Trust Score',              label:'Trust score',           better:'up'   },
  { key:'Positive Sentiment',       label:'Positive sentiment %',  better:'up'   },
  { key:'Negative Sentiment',       label:'Negative sentiment %',  better:'down' },
  { key:'Leads Detected',           label:'Leads detected',        better:'up'   },
  { key:'Hot Leads',                label:'Hot leads',             better:'up'   },
  { key:'Follow-ups Count',         label:'Follow-ups waiting',    better:'down' },
  { key:'Recurring Problems Count', label:'Recurring problems',    better:'down' },
  { key:'Opportunities Count',      label:'Opportunities found',   better:'up'   },
  { key:'Critical Urgency Count',   label:'Critical urgency',      better:'down' }
];
function cmpNum(v){ if(v===null||v===undefined||v==='') return null; const n=parseFloat(String(v).replace('%','')); return isNaN(n)?null:n; }
function cmpRowLabel(r){ return `${(r['Analysis Date']||r['Date']||'').slice(0,10)} · ${r['Your Name or Company']||'—'} · ${r['Platform']||'—'} · Health ${r['Health Score']||'—'}`; }
function cmpWords(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9\u00C0-\u024F ]+/g,' ').split(/\s+/).filter(w=>w.length>3); }
function cmpSame(a,b){
  const A=cmpWords(a), B=cmpWords(b); if(!A.length||!B.length) return false;
  const setB=new Set(B); const shared=A.filter(w=>setB.has(w)).length;
  return shared / Math.min(A.length,B.length) >= 0.5;
}
function cmpParse(full, field, nameKey){
  try { return (JSON.parse(full[field]||'[]')||[]).map(x=> typeof x==='string' ? x : (x[nameKey]||x.title||x.name||'')).filter(Boolean); } catch(e){ return []; }
}
function cmpDiffLists(older, newer){
  return {
    added:    newer.filter(n=>!older.some(o=>cmpSame(o,n))),
    removed:  older.filter(o=>!newer.some(n=>cmpSame(o,n))),
    kept:     newer.filter(n=> older.some(o=>cmpSame(o,n)))
  };
}
function compareDefaults(){
  const h=state.history||[];
  if(!state.compare) state.compare={ a:null, b:null, loading:false, error:null, result:null };
  if(h.length>=2){
    if(state.compare.b===null || !h[state.compare.b]) state.compare.b=0;             // newest
    if(state.compare.a===null || !h[state.compare.a] || state.compare.a===state.compare.b) state.compare.a = state.compare.b===0 ? 1 : 0;
  }
}
function setCompare(which, idx){ compareDefaults(); state.compare[which]=Number(idx); state.compare.result=null; state.compare.error=null; render(); }
function compareWithPrevious(i){
  const h=state.history||[]; if(i+1>=h.length) return;
  state.compare={ a:i+1, b:i, loading:false, error:null, result:null };
  runCompare();
  setTimeout(()=>{ const el=document.getElementById('vqCompareCard'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }, 50);
}
async function runCompare(){
  compareDefaults();
  const h=state.history||[], c=state.compare;
  let older=h[c.a], newer=h[c.b];
  if(!older||!newer) return;
  if(new Date(older['Analysis Date']||0) > new Date(newer['Analysis Date']||0)){ const t=older; older=newer; newer=t; }
  c.loading=true; c.error=null; c.result=null; render();
  try{
    const fetchFull = async (row) => {
      const res = await fetch(base() + '/voiceiq-detail?id=' + encodeURIComponent(row['Analysis ID']), {method:'GET'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    };
    const [fo, fn] = await Promise.all([fetchFull(older), fetchFull(newer)]);
    const metrics = CMP_METRICS.map(m=>{
      const o=cmpNum(older[m.key]), n=cmpNum(newer[m.key]);
      let verdict='same';
      if(o!==null && n!==null && n!==o) verdict = ((n>o)===(m.better==='up')) ? 'better' : 'worse';
      if(o===null || n===null) verdict='na';
      return { label:m.label, o, n, diff:(o!==null&&n!==null)? +(n-o).toFixed(1) : null, verdict };
    });
    const problems = cmpDiffLists(cmpParse(fo,'Recurring Problems JSON','problem'), cmpParse(fn,'Recurring Problems JSON','problem'));
    const opps     = cmpDiffLists(cmpParse(fo,'Opportunities JSON','opportunity'), cmpParse(fn,'Opportunities JSON','opportunity'));
    c.result = { older, newer, metrics, problems, opps, sameEntity: (older['Your Name or Company']||'').trim().toLowerCase()===(newer['Your Name or Company']||'').trim().toLowerCase() };
  }catch(err){
    c.error = window.vqErr('compare those two analyses', err);
  }
  c.loading=false; render();
}
function compareSectionHtml(){
  const h=state.history;
  if(!h || h.length<2) return '';
  compareDefaults();
  const c=state.compare;
  const opts = (sel)=> h.map((r,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(cmpRowLabel(r))}</option>`).join('');
  const badge = (v)=> v==='better' ? `<span style="color:var(--success);font-weight:700;">Better</span>`
                    : v==='worse'  ? `<span style="color:var(--danger);font-weight:700;">Worse</span>`
                    : v==='same'   ? `<span style="color:var(--text-faint);">No change</span>`
                    : `<span style="color:var(--text-faint);">—</span>`;
  const list = (title, items, color, empty)=> `<div style="margin-top:14px;">
      <div class="section-label" style="margin-bottom:6px;color:${color};">${title} (${items.length})</div>
      ${items.length ? items.map(t=>`<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--border-soft);">${esc(t)}</div>`).join('') : `<div style="font-size:13px;color:var(--text-faint);">${empty}</div>`}
    </div>`;
  let body='';
  if(c.loading) body=`<div style="display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:13px;margin-top:12px;"><div class="spinner" style="width:18px;height:18px;margin:0;"></div>Loading both analyses…</div>`;
  else if(c.error) body=vqErrBanner(c.error, 'margin:12px 0 0;');
  else if(c.result){
    const r=c.result;
    const better=r.metrics.filter(m=>m.verdict==='better').length, worse=r.metrics.filter(m=>m.verdict==='worse').length;
    body = `
      ${!r.sameEntity ? `<div class="banner" style="margin:12px 0 0;">These two analyses are for different names ("${esc(r.older['Your Name or Company']||'—')}" vs "${esc(r.newer['Your Name or Company']||'—')}"). The comparison still works, but changes may reflect different audiences rather than progress.</div>` : ''}
      <div style="margin-top:14px;font-size:14px;"><strong>Summary:</strong> ${better} metric${better===1?'':'s'} improved, ${worse} got worse · ${r.problems.added.length} new problem${r.problems.added.length===1?'':'s'}, ${r.problems.removed.length} resolved.</div>
      <div class="table-wrap" style="margin-top:12px;"><table>
        <thead><tr><th>Metric</th><th>${esc((r.older['Analysis Date']||'').slice(0,10))} (earlier)</th><th>${esc((r.newer['Analysis Date']||'').slice(0,10))} (later)</th><th>Change</th><th></th></tr></thead>
        <tbody>${r.metrics.map(m=>`<tr><td>${esc(m.label)}</td><td class="mono">${m.o===null?'—':m.o}</td><td class="mono">${m.n===null?'—':m.n}</td><td class="mono">${m.diff===null?'—':(m.diff>0?'+':'')+m.diff}</td><td>${badge(m.verdict)}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="grid grid-2" style="margin-top:6px;">
        <div>
          ${list('New problems', r.problems.added, 'var(--danger)', 'No new problems appeared.')}
          ${list('Resolved problems', r.problems.removed, 'var(--success)', 'None of the earlier problems disappeared yet.')}
          ${list('Still there', r.problems.kept, 'var(--text-dim)', 'No problem carried over.')}
        </div>
        <div>
          ${list('New opportunities', r.opps.added, 'var(--success)', 'No new opportunities.')}
          ${list('Opportunities no longer mentioned', r.opps.removed, 'var(--text-dim)', 'All earlier opportunities are still showing.')}
        </div>
      </div>
      <div class="field-hint" style="margin-top:10px;">Problems are matched by wording, so a problem described very differently in the two reports may show as both "new" and "resolved". For a long-term view of one business, see Trends.</div>`;
  }
  return `<div class="card" id="vqCompareCard" style="margin-bottom:18px;">
    <div class="widget-head"><div><h3>Compare two analyses</h3><p>See what improved, what got worse, and which problems are new or resolved.</p></div></div>
    <div class="grid grid-2" style="gap:12px;">
      <div class="field" style="margin-bottom:0;"><label class="field-label">Earlier analysis</label><select onchange="setCompare('a', this.value)">${opts(c.a)}</select></div>
      <div class="field" style="margin-bottom:0;"><label class="field-label">Later analysis</label><select onchange="setCompare('b', this.value)">${opts(c.b)}</select></div>
    </div>
    <div style="margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="runCompare()" ${c.a===c.b?'disabled':''}>Compare</button>
      ${c.a===c.b ? `<span style="color:var(--text-faint);font-size:12px;margin-left:8px;">Pick two different analyses.</span>` : ''}</div>
    ${body}
  </div>`;
}
function viewReports(){
  return `${noBaseBanner()}<div class="page-title">Reports</div><div class="page-sub">Completed analyses with their PDF/email delivery status.</div>
    ${historyTable(true)}`;
}

function saveSettings(){
  const v = document.getElementById('webhookInput').value.trim();
  if (v) { state.webhookBase = v; localStorage.setItem('voiceiq_webhook_base', v); }
  else { state.webhookBase = DEFAULT_WEBHOOK_BASE; localStorage.removeItem('voiceiq_webhook_base'); } // clearing the override falls back to the built-in default, never to nothing
  state.history = null;
  document.getElementById('settingsMsg').innerHTML = `<div class="banner success" style="margin-bottom:0;">Saved.</div>`;
  renderNav();
}
async function testConnection(){
  const msg = document.getElementById('settingsMsg');
  msg.innerHTML = `<div style="color:var(--text-dim);font-size:13px;">Testing…</div>`;
  try{
    const res = await fetch(base() + '/voiceiq-history', {method:'GET'});
    if(!res.ok) throw new Error('Server responded ' + res.status);
    msg.innerHTML = `<div class="banner success" style="margin-bottom:0;">Connected — history endpoint responded.</div>`;
  }catch(err){
    msg.innerHTML = `<div class="banner error" style="margin-bottom:0;">Couldn't reach it: ${esc(err.message)}. Confirm the workflow is Active and the URL is correct.</div>`;
  }
}

<script>
/* ===== VoiceIQ size guard (added in version 41) ===== */
(function () {
'use strict';
/* A paste is safe up to about SOFT characters. Past that, History keeps a shortened copy. Past HARD, Gemini cannot read it. */

function H(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nf(n) { return Number(n).toLocaleString('en-US'); }
function stats(text) {
  var t = String(text || ''), at = t.match(/^@\S+/gm), n = at ? at.length : (t.trim() ? t.split(/\n+/).filter(function (x) { return x.trim(); }).length : 0);
  return { chars: t.length, comments: n };
}
function say(s) {
  if (!s.chars) return { cls: 'ok', html: '' };
  var base = 'about ' + nf(s.comments) + ' comment' + (s.comments === 1 ? '' : 's') + ' \u00B7 ' + nf(s.chars) + ' characters';
  if (s.chars > HARD) return { cls: 'bad', html: base + '. <strong>Too big for one analysis</strong> (the limit is about ' + nf(HARD) + ' characters). Split it into smaller parts and analyse each one.' };
  if (s.chars > SOFT) return { cls: 'warn', html: base + '. <strong>Long paste.</strong> The analysis reads all of it, but History keeps only about the first ' + nf(SOFT) + ' characters, so the saved copy is shortened.' };
  return { cls: 'ok', html: base };
}
function box() { return document.querySelector('#content textarea[oninput*="f_update(\'comments\'"]'); }
function paint() {
  var ta = box(); if (!ta) return;

}
/* the counter follows typing and pasting */
try { var origUpdate = f_update; f_update = function (k) { var r = origUpdate.apply(this, arguments); if (k === 'comments') paint(); return r; }; } catch (e) {}

function init() {

async function mfaConfirm(factorId) {

  var s = sess();
  var buckets = { profile: [], security: [], billing: [], support: [], legal: [], other: [] }, top = [];
  Array.prototype.slice.call(tmp.children).forEach(function (el) {
    if (el.classList.contains('page-title') || el.classList.contains('page-sub')) return;

/* ---------- idle sign-out ---------- */
var IDLE_KEY = 'voiceiq_last_active';
function touch() { try { sessionStorage.setItem(IDLE_KEY, String(Date.now())); } catch (e) {} }
var lastTouch = 0;
function onActivity() { var n = Date.now(); if (n - lastTouch > 15000) { lastTouch = n; touch(); } }
function idleCheck() {
  var s = sess(); if (!s) return;
  var last = 0; try { last = Number(sessionStorage.getItem(IDLE_KEY)) || 0; } catch (e) {}
  if (!last) { touch(); return; }
  var limitMin = (function () { try { return localStorage.getItem('voiceiq_remember') === '1' ? 24 * 60 : IDLE_MIN; } catch (e) { return IDLE_MIN; } })();
  if (Date.now() - last > limitMin * 60 * 1000) {
    try { sessionStorage.removeItem(IDLE_KEY); } catch (e) {}
    try { VQAuth.endSession(limitMin > IDLE_MIN ? 'You were signed out after a day of inactivity.' : 'You were signed out after ' + IDLE_MIN + ' minutes of inactivity.'); } catch (e) {}
  }
}
['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, onActivity, { passive: true }); });
setInterval(idleCheck, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) idleCheck(); });

/* ---------- wiring ---------- */
var CSS = '.vq-set{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:0 0 14px;max-width:760px;overflow:hidden}' +

  if (typeof VIEWS === 'undefined' || !VIEWS.account || typeof NAV === 'undefined' || window.__vqSettingsWired) return;

<script>

    (job.comments ? job.comments.toLocaleString() + ' comments \u00b7 ' : '') + (job.batches > 1 ? job.batches + ' batches \u00b7 ' : '') + mm + ':' + ss + ' elapsed \u00b7 about ' + mins(job.comments) + ' min</div></div>';

document.head.appendChild(st);

<script>

<script>
/* ===== v52: (a) audience wording everywhere, (b) strip tracking links from pasted/uploaded comments ===== */
(function () {

function rewrite(t, pair) {
  return t.replace(/\b(Customers|customers|Customer|customer)\b([ \u00A0]?)(\w*)/g, function (m, word, sp, next) {
    var low = String(next || '').toLowerCase();
    if (low === 'service' || low === 'care' || low === 'support' || low === 'services') return m;   /* "Customer service" is a team name */
    var plural = word.toLowerCase() === 'customers', out = caseOf(word, plural ? pair[0] : pair[1]);

  });
}

  pending = false;

    var pair = NOUN[grp()]; if (!pair) return;

      var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n, jobs = [];
      while ((n = w.nextNode())) {
        var v = n.nodeValue; if (!v || v.indexOf('ustomer') === -1) continue;
        if (n.parentElement && n.parentElement.closest(KEEP)) continue;
        var out = rewrite(v, pair); if (out !== v) jobs.push([n, out]);
      }
      jobs.forEach(function (j) { j[0].nodeValue = j[1]; });
    });
  } catch (e) {}

var LONGURL = /\bhttps?:\/\/\S{60,}/g, FBPARAM = /(?:\?|&)(?:__cft__|__tn__|fbclid|comment_id|reply_comment_id|notif_id|notif_t|ref|mibextid)(?:\[\d+\])?=[^\s&]*/g, SHORT = /\bhttps?:\/\/\S+/g;

    if (/^(?:Like|Reply|Share|Edited|See more|See translation|Hide|Top fan|Author)(?:\s*[·|\-]\s*(?:Like|Reply|Share|Edited|See more|See translation|\d+\s*[hdwmy]|\d+\s*(?:hour|day|week|min)\w*\s*ago))*$/i.test(l)) return '';
    return l.replace(/\s*[·|]\s*(?:Like|Reply|Share|Edited|See more)(?:\s*[·|]\s*(?:Like|Reply|Share|Edited|See more))*\s*$/i, '').trim();
  }).filter(function (l, i, arr) { return l !== '' || (i && arr[i - 1] !== ''); }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  return { text: t, removed: before - t.length, before: before };
}
var U = { prev: null, removed: 0 };
function nf(n) { return Number(n).toLocaleString('en-US'); }
function noticeHtml() {
  if (!U.removed) return '';
  return '<div class="banner success vq-tidy" style="margin:8px 0 0;"><div><strong>Removed ' + nf(U.removed) + ' characters</strong> of links and \u201CLike \u00B7 Reply\u201D clutter. Only the words people wrote are analysed, which is cheaper and more accurate. <button type="button" class="btn btn-sm btn-secondary" style="margin-left:6px;" onclick="VQTidy.undo()">Undo</button></div></div>';
}
function paint() {

  var ta = document.querySelector('#content textarea[oninput*="f_update(\'comments\'"]'); if (!ta) return;

    U.prev = cur; U.removed = r.removed; f.comments = r.text; U.lastSeen = r.text;

};

<script>
/* ===== v55: the written report, laid out properly =====
   Turns "1. Do the thing - Who: X | Measure: Y | Goal: Z | By when: W" into a card with
   the action as a heading and each field on its own line. Everything else renders as before. */
(function () {
'use strict';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var FIELD = /(Who|Owner|Measure|Goal|Target|By when|Timeline|When|Format|Solves|Aim|Impact|Effort|Cost)\s*:\s*/gi;
var ORDER = { who: 1, owner: 1, format: 1, measure: 2, solves: 2, goal: 3, target: 3, aim: 3, impact: 4, 'by when': 5, timeline: 5, when: 5, effort: 6, cost: 6 };
/* pull "Label: value" pairs out of one line, keeping what came before as the action itself */
function split(line) {
  var m = FIELD.exec(line); FIELD.lastIndex = 0;
  if (!m) return null;
  var head = line.slice(0, m.index).replace(/\s*[\u2014\u2013-]\s*$/, '').replace(/\s*\|\s*$/, '').trim();
  var rest = line.slice(m.index), out = [], cur = null, re = new RegExp(FIELD.source, 'gi'), mm, last = 0;
  while ((mm = re.exec(rest))) {
    if (cur) { cur.v = rest.slice(last, mm.index).replace(/\s*\|\s*$/, '').replace(/\s*[\u2014\u2013-]\s*$/, '').trim(); out.push(cur); }
    cur = { k: mm[1], v: '' }; last = re.lastIndex;
  }
  if (cur) { cur.v = rest.slice(last).replace(/\s*\|\s*$/, '').trim(); out.push(cur); }
  out = out.filter(function (x) { return x.v; });
  if (!out.length) return null;
  out.sort(function (a, b) { return (ORDER[a.k.toLowerCase()] || 9) - (ORDER[b.k.toLowerCase()] || 9); });
  return { head: head, fields: out };
}
function inline(t) { return esc(t).replace(/\*\*([^*\n]{1,200})\*\*/g, '<strong>$1</strong>'); }
function card(n, p) {
  return '<div class="vq-step"><div class="vq-step-n">' + n + '</div><div class="vq-step-b">' +
    (p.head ? '<div class="vq-step-t">' + inline(p.head) + '</div>' : '') +
    '<dl class="vq-step-f">' + p.fields.map(function (f) {
      return '<dt>' + esc(f.k.replace(/^by when$/i, 'By when')) + '</dt><dd>' + inline(f.v) + '</dd>';
    }).join('') + '</dl></div></div>';
}
window.vqReportHtml = function (text) {
  var src = String(text == null ? '' : text);
  if (!src.trim()) return '<div class="report-text">No report text returned.</div>';
  var lines = src.split('\n'), out = [], buf = [];
  var flush = function () { if (buf.length) { out.push('<div class="report-text">' + buf.join('\n') + '</div>'); buf = []; } };
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i], num = /^\s*(\d+)[.)]\s+(.*)$/.exec(line);
    if (num) {
      var p = split(num[2].replace(/\*\*/g, ''));
      if (p) { flush(); out.push(card(num[1], p)); continue; }
    }
    var head = /^\s*(?:#{1,4}\s*)?\*\*([^*\n]{1,200})\*\*\s*:?\s*$/.exec(line);
    if (head) { flush(); out.push('<div class="vq-rep-h">' + esc(head[1].replace(/:$/, '')) + '</div>'); continue; }
    buf.push(inline(line).replace(/^#{1,4}\s*(.+)$/, '<strong>$1</strong>'));
  }
  flush();
  return out.join('');
};
var CSS = '.vq-rep-h{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--border-soft)}' +
 '.vq-rep-h:first-child{margin-top:0;padding-top:0;border-top:0}' +

 '@media(max-width:560px){.vq-step-f{grid-template-columns:1fr;gap:2px 0}.vq-step-f dt{margin-top:6px}}';
function go() { var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st); }
